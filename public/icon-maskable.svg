<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
  </defs>
  <!-- Full-bleed: maskable icon bị crop thành hình tròn/squircle nên nền phải
       tràn viền và nội dung phải nằm trong vùng an toàn 80% ở giữa. -->
  <rect width="64" height="64" fill="url(#bg)"/>
  <g fill="#ffffff" transform="translate(32 32) scale(0.62) translate(-32 -32)">
    <rect x="14" y="14" width="16" height="16" rx="4" opacity="0.95"/>
    <rect x="34" y="14" width="16" height="16" rx="4" opacity="0.7"/>
    <rect x="14" y="34" width="16" height="16" rx="4" opacity="0.7"/>
    <rect x="34" y="34" width="16" height="16" rx="4" opacity="0.95"/>
  </g>
</svg>
